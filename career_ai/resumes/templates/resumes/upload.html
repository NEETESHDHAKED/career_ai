<!DOCTYPE html>
<html><head>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0f172a] text-white min-h-screen flex items-center justify-center" style="font-family:Inter">
<div class="bg-white/5 border border-white/10 p-8 rounded-[24px] w-[450px] text-center">
  <h2 class="text-2xl font-bold">Upload Your Resume</h2>
  <p class="text-sm text-slate-400 mt-2 mb-6">AI will check ATS Score & Skills</p>
  <form method="post" enctype="multipart/form-data" class="border border-dashed border-white/20 rounded-2xl p-8">
    {% csrf_token %}
    <p class="text-4xl mb-3"></p>
    <input type="file" name="resume" accept=".pdf,.docx" required class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-cyan-400 file:text-black file:font-semibold mb-4">
    <button class="w-full bg-cyan-400 text-black py-3 rounded-xl font-semibold mt-2">Analyze Resume</button>
  </form>
  <a href="/dashboard/" class="text-xs text-slate-400 mt-6 inline-block">← Back to Dashboard</a>
</div>
</body></html>
