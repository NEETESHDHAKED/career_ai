<!DOCTYPE html>
<html><head>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-white min-h-screen p-8">
<div class="max-w-3xl mx-auto">
  <h1 class="text-3xl font-bold">Resume Analysis</h1>
  <div class="bg-white/5 border border-white/10 rounded-2xl p-6 mt-6">
    <p class="text-sm text-slate-400">ATS SCORE</p>
    <p class="text-6xl font-bold text-cyan-400 mt-2">{{ resume.ats_score }}%</p>
    <p class="mt-2 text-sm">{% if resume.ats_score > 70 %}Excellent!{% elif resume.ats_score > 50 %}Good, can improve{% else %}Needs improvement{% endif %}</p>
  </div>
  <div class="bg-white/5 border border-white/10 rounded-2xl p-6 mt-4">
    <h3 class="font-semibold">Extracted Text Preview</h3>
    <p class="text-xs text-slate-300 mt-3 whitespace-pre-wrap h-60 overflow-y-auto">{{ resume.extracted_text|truncatechars:2000 }}</p>
  </div>
  <div class="flex gap-3 mt-6">
    <a href="/resumes/upload/" class="bg-white/10 px-5 py-3 rounded-full text-sm">Upload Another</a>
    <a href="/dashboard/" class="bg-cyan-400 text-black px-5 py-3 rounded-full text-sm font-semibold">Go to Dashboard</a>
  </div>
</div>
</body></html>
